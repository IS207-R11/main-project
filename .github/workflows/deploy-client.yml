name: Deploy client (main) to production

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

# Không chạy 2 lần deploy song song; deploy sau chờ deploy trước xong
concurrency:
  group: deploy-client-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.ANGI_VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.ANGI_VERCEL_TOKEN }}

      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token=${{ secrets.ANGI_VERCEL_TOKEN }}
